# render.yaml — Declarative Render deployment configuration
# Tells Render to use Node.js runtime with npm commands, NOT the Dockerfile.
# Reference: https://render.com/docs/render-yaml-reference

services:
  - type: web
    name: SmartphoneCentre
    runtime: node
    region: oregon
    plan: free

    # Build: compile server TypeScript + Vite React bundle
    buildCommand: npm run build

    # Start: run the Express server (serves both /api/* AND static frontend)
    startCommand: npm start

    # Render sends health-check pings here. Must return 2xx for the service to be "healthy".
    healthCheckPath: /api/health

    # These env vars are read from the Render dashboard; list them here so
    # render.yaml documents what variables are expected (actual values stay secret).
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
      - key: DATABASE_URL
        sync: false       # secret — set manually in Render dashboard
      - key: JWT_SECRET
        sync: false       # secret — set manually in Render dashboard
      - key: JWT_EXPIRES_IN
        sync: false
      - key: ADMIN_PIN_HASH
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Auth System ──────────────────────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false       # Google OAuth Client ID (from Google Cloud Console)
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false       # Frontend Google OAuth Client ID
      - key: SMTP_HOST
        sync: false       # e.g. smtp.hostinger.com
      - key: SMTP_PORT
        sync: false       # e.g. 465
      - key: SMTP_SECURE
        sync: false       # true for 465, false for 587
      - key: SMTP_USER
        sync: false       # e.g. support@rephonix.in
      - key: SMTP_PASS
        sync: false       # secret — Hostinger SMTP app password
      - key: EMAIL_FROM
        sync: false       # e.g. Rephonix <support@rephonix.in>
      - key: FRONTEND_URL
        sync: false       # e.g. https://www.rephonix.in
      # ── Firebase Configuration ───────────────────────────────────────────────
      - key: FIREBASE_PROJECT_ID
        value: rephonix-f2cfa
      - key: VITE_FIREBASE_PROJECT_ID
        value: rephonix-f2cfa
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: rephonix-f2cfa.firebaseapp.com
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyBmhYvC0BrBU6hXVVFu4GwUigZsM0NEMD0

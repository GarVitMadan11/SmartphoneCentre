server {
    listen 80;
    server_name localhost;

    # ── Security Headers ─────────────────────────────────────────────────────
    # Prevent this site from being embedded in iframes (clickjacking protection)
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent browsers from MIME-sniffing the content type
    add_header X-Content-Type-Options "nosniff" always;
    # Only send the origin (no path/query) as referrer to third-party sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Tell browsers to always use HTTPS for this origin for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Disable browser features that the app doesn't need
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enforce Content-Security-Policy over HTTPS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://api.emailjs.com https://accounts.google.com https://apis.google.com https://www.google.com https://www.gstatic.com https://*.firebaseapp.com https://*.googleapis.com; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' blob: https://api.emailjs.com https://accounts.google.com https://apis.google.com https://www.google.com https://www.gstatic.com https://*.firebaseapp.com https://*.googleapis.com; worker-src 'self' blob:; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com https://*.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.emailjs.com https://accounts.google.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com https://rephonix.in https://www.rephonix.in; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # Serve the static files from Vite build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Express backend container
    location /api {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

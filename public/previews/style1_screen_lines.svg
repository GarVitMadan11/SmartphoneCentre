<svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad_lines" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Clip path to keep lines strictly inside the display glass -->
    <clipPath id="screen_clip">
      <rect x="52" y="24" width="56" height="112" rx="11"/>
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect width="160" height="160" rx="20" fill="url(#bg_grad_lines)"/>
  <rect x="0.5" y="0.5" width="159" height="159" rx="19.5" stroke="#E2E8F0"/>

  <!-- Phone Chassis Outline -->
  <rect x="49" y="21" width="62" height="118" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Screen Content (Clipped to display panel) -->
  <g clip-path="url(#screen_clip)">
    <!-- Soft display glass backdrop -->
    <rect x="52" y="24" width="56" height="112" fill="#F8FAFC"/>

    <!-- Sharp Neon Vertical Laser Lines (OLED Defect) -->
    <line x1="68" y1="20" x2="68" y2="140" stroke="#EF4444" stroke-width="2.2"/>
    <line x1="71" y1="20" x2="71" y2="140" stroke="#10B981" stroke-width="1.8"/>

    <!-- Organic OLED Liquid Bleed & Dead Pixel Clusters -->
    <!-- Bleed 1 on the red laser line -->
    <circle cx="68" cy="86" r="4.5" fill="#0F172A"/>
    <circle cx="66" cy="84" r="2.5" fill="#0F172A"/>
    
    <!-- Bleed 2 upper right -->
    <circle cx="94" cy="52" r="3.8" fill="#0F172A"/>
    <circle cx="96" cy="54" r="2.2" fill="#0F172A"/>

    <!-- Bleed 3 lower left -->
    <circle cx="61" cy="106" r="3" fill="#0F172A"/>

    <!-- Bleed 4 lower right -->
    <circle cx="91" cy="114" r="3.5" fill="#0F172A"/>
  </g>

  <!-- Dynamic Island & Speaker Hardware (Always on top of display glass) -->
  <rect x="71" y="27" width="18" height="5" rx="2.5" fill="#0F172A"/>
  <circle cx="74" cy="29.5" r="1.2" fill="#1E293B"/>
  <circle cx="84" cy="29.5" r="1.2" fill="#0284C7"/>

  <!-- Bottom Home Indicator -->
  <rect x="68" y="131" width="24" height="2" rx="1" fill="#94A3B8"/>
</svg>
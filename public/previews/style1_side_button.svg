<svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background subtle luxury tint -->
    <linearGradient id="bg_grad_btn" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Mathematical spotlight gradient emanating from the button on the side rail -->
    <linearGradient id="btn_spotlight_v2" x1="55" y1="68" x2="112" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Loupe floating shadow -->
    <filter id="loupe_shadow_v2" x="86" y="44" width="52" height="52" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="160" height="160" rx="20" fill="url(#bg_grad_btn)"/>
  <rect x="0.5" y="0.5" width="159" height="159" rx="19.5" stroke="#E2E8F0"/>

  <!-- Spotlight Conical Beam (Originates right from the Volume Up button on the side rail) -->
  <path d="M 55 60 L 112 48 L 112 88 L 55 76 Z" fill="url(#btn_spotlight_v2)"/>

  <!-- Ground baseline (Cashify architectural grounding line) -->
  <line x1="28" y1="135" x2="72" y2="135" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Upright Phone Side Frame (Viewed directly from the side) -->
  <path d="M 42 135 V 33 C 42 27.5 45.6 23 50 23 C 54.4 23 58 27.5 58 33 V 135" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Antenna Band Line across side frame -->
  <line x1="42.5" y1="36" x2="57.5" y2="36" stroke="#94A3B8" stroke-width="1.8"/>

  <!-- 1. Action / Mute Button ON the side frame -->
  <rect x="46" y="44" width="8" height="8" rx="3" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>

  <!-- 2. Volume Up Button ON the side frame (Targeted Component) -->
  <rect x="45.5" y="60" width="9" height="16" rx="4.5" fill="#10B981" stroke="#059669" stroke-width="1.8"/>
  <line x1="50" y1="64.5" x2="50" y2="71.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 3. Volume Down Button ON the side frame -->
  <rect x="46" y="84" width="8" height="16" rx="4" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Inspection Loupe (Magnifying Glass Badge) -->
  <g filter="url(#loupe_shadow_v2)">
    <!-- Outer rim -->
    <circle cx="112" cy="68" r="20" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="112" cy="68" r="17.5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Warning Triangle inside Loupe -->
    <path d="M 112 55.5 L 124.5 77 H 99.5 Z" fill="#10B981" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Exclamation Mark -->
    <line x1="112" y1="61.5" x2="112" y2="69" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="112" cy="73.5" r="1.3" fill="#FFFFFF"/>
  </g>
</svg>
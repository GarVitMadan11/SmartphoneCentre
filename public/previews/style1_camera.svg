<svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad_cam" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="cam_spotlight" x1="62" y1="42" x2="114" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="loupe_shadow_cam" x="88" y="66" width="52" height="52" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="160" height="160" rx="20" fill="url(#bg_grad_cam)"/>
  <rect x="0.5" y="0.5" width="159" height="159" rx="19.5" stroke="#E2E8F0"/>

  <!-- Spotlight Conical Beam (From Lens to Loupe) -->
  <path d="M 64 36 L 126 78 L 100 108 L 60 48 Z" fill="url(#cam_spotlight)"/>

  <!-- Phone Rear Chassis -->
  <rect x="36" y="22" width="58" height="116" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Luxury Camera Plateau (Apple Pro Style) -->
  <rect x="42" y="28" width="28" height="38" rx="10" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>

  <!-- Primary Camera Lens (Targeted with Emerald Ring) -->
  <circle cx="56" cy="38" r="6.5" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <circle cx="56" cy="38" r="3" fill="#FFFFFF"/>
  <circle cx="56" cy="38" r="1.5" fill="#0F172A"/>

  <!-- Secondary Camera Lens -->
  <circle cx="56" cy="54" r="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.8"/>
  <circle cx="56" cy="54" r="2.5" fill="#334155"/>

  <!-- True Tone LED Flash & Sensor -->
  <circle cx="47" cy="46" r="2.2" fill="#FDE047" stroke="#CA8A04" stroke-width="0.8"/>
  <circle cx="47" cy="54" r="1.2" fill="#0F172A"/>

  <!-- Inspection Loupe (Magnifying Glass Badge) -->
  <g filter="url(#loupe_shadow_cam)">
    <!-- Outer rim -->
    <circle cx="114" cy="90" r="20" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="114" cy="90" r="17.5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Warning Triangle inside Loupe -->
    <path d="M 114 77.5 L 126.5 99 H 101.5 Z" fill="#10B981" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Exclamation Mark -->
    <line x1="114" y1="83.5" x2="114" y2="91" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="114" cy="95.5" r="1.3" fill="#FFFFFF"/>
  </g>
</svg>
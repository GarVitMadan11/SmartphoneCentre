<svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad_port" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <linearGradient id="port_spotlight" x1="80" y1="110" x2="80" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="loupe_shadow_port" x="54" y="26" width="52" height="52" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="160" height="160" rx="20" fill="url(#bg_grad_port)"/>
  <rect x="0.5" y="0.5" width="159" height="159" rx="19.5" stroke="#E2E8F0"/>

  <!-- Spotlight Conical Beam (From Port up to Loupe) -->
  <path d="M 72 110 L 60 52 L 100 52 L 88 110 Z" fill="url(#port_spotlight)"/>

  <!-- Bottom Phone Edge Chassis -->
  <rect x="25" y="104" width="110" height="22" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Antenna Lines on Chassis -->
  <line x1="38" y1="104" x2="38" y2="126" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="122" y1="104" x2="122" y2="126" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Speaker Grille Holes (Left) -->
  <circle cx="48" cy="115" r="2" fill="#0F172A"/>
  <circle cx="54" cy="115" r="2" fill="#0F172A"/>
  <circle cx="60" cy="115" r="2" fill="#0F172A"/>

  <!-- Pentalobe Security Screws -->
  <circle cx="67" cy="115" r="1.2" fill="#64748B"/>
  <circle cx="93" cy="115" r="1.2" fill="#64748B"/>

  <!-- USB-C / Lightning Port (Targeted Component) -->
  <rect x="71" y="109" width="18" height="12" rx="5" fill="#10B981" stroke="#059669" stroke-width="2"/>
  <rect x="75" y="113.5" width="10" height="3" rx="1.5" fill="#FFFFFF"/>

  <!-- Microphone Holes (Right) -->
  <circle cx="100" cy="115" r="2" fill="#0F172A"/>
  <circle cx="106" cy="115" r="2" fill="#0F172A"/>
  <circle cx="112" cy="115" r="2" fill="#0F172A"/>

  <!-- Inspection Loupe (Magnifying Glass Badge) -->
  <g filter="url(#loupe_shadow_port)">
    <!-- Outer rim -->
    <circle cx="80" cy="50" r="20" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="80" cy="50" r="17.5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Warning Triangle inside Loupe -->
    <path d="M 80 37.5 L 92.5 59 H 67.5 Z" fill="#10B981" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Exclamation Mark -->
    <line x1="80" y1="43.5" x2="80" y2="51" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="80" cy="55.5" r="1.3" fill="#FFFFFF"/>
  </g>
</svg>